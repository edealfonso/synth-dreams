{% load i18n %}

<div id="CookielawBanner" class="cookie-banner">
    <div class="cookie-banner__inner">
        <h6 class="cookie-banner__title">{% trans "COOKIE_INFO_HEADER" %}</h6>
        <div class="cookie-banner__body">
            <p class="cookie-banner__text">
                {% trans "COOKIE_INFO_PARA" %}
            </p>
            <div class="cookie-banner__buttons">
                <a class="cookie-banner__button" href="javascript:Cookielaw.accept();">{% trans "COOKIE_INFO_OK" %}</a>
                <a class="cookie-banner__button" href="javascript:Cookielaw.reject();">{% trans "COOKIE_INFO_REJECT" %}</a>
            </div>
        </div>
    </div>
    <div id="CookielawCross" class="cookie-banner__close"></div>
</div>
